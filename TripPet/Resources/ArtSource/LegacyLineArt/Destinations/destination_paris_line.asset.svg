<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360" role="img" aria-label="destination_paris_line" >
  <defs>
    <filter id="paperNoise" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" seed="17" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 0.08"/>
      </feComponentTransfer>
    </filter>
    <filter id="softBleed" x="-12%" y="-12%" width="124%" height="124%">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="9" result="texture"/>
      <feDisplacementMap in="SourceGraphic" in2="texture" scale="3.2"/>
    </filter>
    <filter id="pencilRough" x="-8%" y="-8%" width="116%" height="116%">
      <feTurbulence type="fractalNoise" baseFrequency="0.08" numOctaves="2" seed="5" result="rough"/>
      <feDisplacementMap in="SourceGraphic" in2="rough" scale="1.1"/>
    </filter>
    
  </defs>
  
    <ellipse cx="239" cy="251" rx="150" ry="76" fill="#E9B9A4" opacity="0.14" filter="url(#softBleed)"/>
    <path d="M239 73 L151 330 L331 330 Z" fill="none" stroke="#3D4338" stroke-width="8" stroke-linejoin="round" stroke-linecap="round" filter="url(#pencilRough)"/>
    <path d="M204 184 L276 184 M184 242 L296 242 M166 300 L315 300" stroke="#3D4338" stroke-width="6" stroke-linecap="round" opacity="0.78" filter="url(#pencilRough)"/>
    <path d="M209 159 L277 330 M269 159 L200 330" stroke="#74766F" stroke-width="5" stroke-linecap="round"/>
    <path d="M130 337 C210 311 298 313 366 337" fill="none" stroke="#8FAF95" stroke-width="9" stroke-linecap="round" opacity="0.35"/>
    <path d="M85 354 C182 376 320 375 408 354" fill="none" stroke="#A9C9D8" stroke-width="7" stroke-linecap="round" opacity="0.45"/>
  
</svg>
