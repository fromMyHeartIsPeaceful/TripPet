<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-label="trip_route_map_paris" >
  <defs>
    <filter id="paperNoise" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" seed="17" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 0.08"/>
      </feComponentTransfer>
    </filter>
    <filter id="softBleed" x="-12%" y="-12%" width="124%" height="124%">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="9" result="texture"/>
      <feDisplacementMap in="SourceGraphic" in2="texture" scale="3.2"/>
    </filter>
    <filter id="pencilRough" x="-8%" y="-8%" width="116%" height="116%">
      <feTurbulence type="fractalNoise" baseFrequency="0.08" numOctaves="2" seed="5" result="rough"/>
      <feDisplacementMap in="SourceGraphic" in2="rough" scale="1.1"/>
    </filter>
    
  </defs>
  
    <rect width="640" height="360" fill="none"/>
    <path d="M 55 45 L 586 56 L 568 316 L 72 304 Z" fill="#FFF9EF" stroke="#74766F" stroke-width="5" filter="url(#softBleed)"/>
    <path d="M118 250 C178 185 230 198 282 145 C340 84 432 113 506 69" fill="none" stroke="#A9C9D8" stroke-width="13" stroke-linecap="round" opacity="0.56" filter="url(#softBleed)"/>
    <path d="M118 250 C178 185 230 198 282 145 C340 84 432 113 506 69" fill="none" stroke="#3D4338" stroke-width="4" stroke-dasharray="10 13" stroke-linecap="round" opacity="0.6" filter="url(#pencilRough)"/>
    <circle cx="118" cy="250" r="24" fill="#8FAF95" opacity="0.46" stroke="#3D4338" stroke-width="4" filter="url(#softBleed)"/>
    <path d="M106 250 L119 238 L132 250 M112 250 L112 266 L126 266 L126 250" fill="none" stroke="#3D4338" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="506" cy="69" r="26" fill="#D8B36A" opacity="0.5" stroke="#3D4338" stroke-width="4" filter="url(#softBleed)"/>
    <path d="M506 48 L486 109 L526 109 Z M498 79 L514 79" fill="none" stroke="#3D4338" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M95 107 C143 87 197 91 236 118 C280 94 347 94 393 126" fill="none" stroke="#74766F" stroke-width="5" stroke-linecap="round" opacity="0.34"/>
    <path d="M103 294 C228 319 420 318 544 294" fill="none" stroke="#8FAF95" stroke-width="8" stroke-linecap="round" opacity="0.25"/>
  
</svg>
