    <circle cx="548" cy="61" r="27" fill="#A9C9D8" opacity="0.58" stroke="#3D4338" stroke-width="4" filter="url(#softBleed)"/>
    <path d="M514 90 L544 48 L562 75 L581 43 L606 90 Z" fill="none" stroke="#3D4338" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
