<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360" role="img" aria-label="destination_iceland_line" >
  <defs>
    <filter id="paperNoise" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" seed="17" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 0.08"/>
      </feComponentTransfer>
    </filter>
    <filter id="softBleed" x="-12%" y="-12%" width="124%" height="124%">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="9" result="texture"/>
      <feDisplacementMap in="SourceGraphic" in2="texture" scale="3.2"/>
    </filter>
    <filter id="pencilRough" x="-8%" y="-8%" width="116%" height="116%">
      <feTurbulence type="fractalNoise" baseFrequency="0.08" numOctaves="2" seed="5" result="rough"/>
      <feDisplacementMap in="SourceGraphic" in2="rough" scale="1.1"/>
    </filter>
    
  </defs>
  
    <ellipse cx="236" cy="225" rx="190" ry="90" fill="#A9C9D8" opacity="0.18" filter="url(#softBleed)"/>
    <path d="M45 293 L142 159 L208 249 L281 119 L430 293 Z" fill="#A9C9D8" opacity="0.28" stroke="#3D4338" stroke-width="7" stroke-linejoin="round" filter="url(#softBleed)"/>
    <path d="M142 159 L169 217 L207 249 M281 119 L244 215 L310 192" fill="none" stroke="#FFF9EF" stroke-width="8" stroke-linecap="round" opacity="0.86"/>
    <path d="M94 90 C136 63 180 68 214 101 C252 73 305 77 342 112" fill="none" stroke="#74766F" stroke-width="7" stroke-linecap="round" opacity="0.48"/>
    <path d="M64 306 C162 337 316 337 421 306" fill="none" stroke="#8FAF95" stroke-width="8" stroke-linecap="round" opacity="0.33"/>
  
</svg>
