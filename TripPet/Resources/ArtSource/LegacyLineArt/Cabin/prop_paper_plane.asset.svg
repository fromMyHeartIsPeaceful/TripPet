<svg xmlns="http://www.w3.org/2000/svg" width="260" height="180" viewBox="0 0 260 180" role="img" aria-label="prop_paper_plane" >
  <defs>
    <filter id="paperNoise" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" seed="17" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 0.08"/>
      </feComponentTransfer>
    </filter>
    <filter id="softBleed" x="-12%" y="-12%" width="124%" height="124%">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="9" result="texture"/>
      <feDisplacementMap in="SourceGraphic" in2="texture" scale="3.2"/>
    </filter>
    <filter id="pencilRough" x="-8%" y="-8%" width="116%" height="116%">
      <feTurbulence type="fractalNoise" baseFrequency="0.08" numOctaves="2" seed="5" result="rough"/>
      <feDisplacementMap in="SourceGraphic" in2="rough" scale="1.1"/>
    </filter>
    
  </defs>
  
    <rect width="260" height="180" fill="none"/>
    <path d="M 24 92 L 229 28 L 162 151 L 123 104 Z" fill="#FFF9EF" stroke="#3D4338" stroke-width="5" stroke-linejoin="round" filter="url(#softBleed)"/>
    <path d="M123 104 L229 28 L142 120" fill="none" stroke="#74766F" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" filter="url(#pencilRough)"/>
    <path d="M24 92 L123 104 L88 133 Z" fill="#A9C9D8" opacity="0.38" stroke="#3D4338" stroke-width="4" stroke-linejoin="round" filter="url(#softBleed)"/>
    <path d="M40 137 C70 161 120 164 158 145" fill="none" stroke="#8FAF95" stroke-width="6" stroke-linecap="round" opacity="0.38"/>
    <path d="M22 128 C43 145 72 150 94 143" fill="none" stroke="#D8B36A" stroke-width="4" stroke-linecap="round" opacity="0.34"/>
  
</svg>
