<svg xmlns="http://www.w3.org/2000/svg" width="520" height="250" viewBox="0 0 520 250" role="img" aria-label="prop_ticket_single" >
  <defs>
    <filter id="paperNoise" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" seed="17" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 0.08"/>
      </feComponentTransfer>
    </filter>
    <filter id="softBleed" x="-12%" y="-12%" width="124%" height="124%">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="9" result="texture"/>
      <feDisplacementMap in="SourceGraphic" in2="texture" scale="3.2"/>
    </filter>
    <filter id="pencilRough" x="-8%" y="-8%" width="116%" height="116%">
      <feTurbulence type="fractalNoise" baseFrequency="0.08" numOctaves="2" seed="5" result="rough"/>
      <feDisplacementMap in="SourceGraphic" in2="rough" scale="1.1"/>
    </filter>
    
  </defs>
  
    <rect width="520" height="250" fill="none"/>
    <path d="M 46 64 L 474 53 L 462 190 L 57 203 Z" fill="#D8B36A" opacity="0.46" filter="url(#softBleed)"/>
    <path d="M 47 62 L 475 54 L 461 191 L 56 203 Z" fill="none" stroke="#74766F" stroke-width="5" filter="url(#pencilRough)"/>
    <path d="M164 62 C143 85 145 171 171 198" fill="none" stroke="#74766F" stroke-width="4" stroke-dasharray="12 12" opacity="0.65"/>
    <path d="M208 104 C270 86 348 90 412 115" fill="none" stroke="#8FAF95" stroke-width="8" stroke-linecap="round" opacity="0.48"/>
    <path d="M214 151 L397 146" stroke="#3D4338" stroke-width="5" stroke-linecap="round" opacity="0.55"/>
    <circle cx="98" cy="132" r="31" fill="#FFF9EF" opacity="0.72" stroke="#74766F" stroke-width="4"/>
    <path d="M82 133 C97 116 113 116 126 132 C114 148 96 150 82 133 Z" fill="none" stroke="#8FAF95" stroke-width="5" stroke-linejoin="round"/>
  
</svg>
