<svg xmlns="http://www.w3.org/2000/svg" width="520" height="220" viewBox="0 0 520 220" role="img" aria-label="ticket_flight_trail" >
  <defs>
    <filter id="paperNoise" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" seed="17" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 0.08"/>
      </feComponentTransfer>
    </filter>
    <filter id="softBleed" x="-12%" y="-12%" width="124%" height="124%">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="9" result="texture"/>
      <feDisplacementMap in="SourceGraphic" in2="texture" scale="3.2"/>
    </filter>
    <filter id="pencilRough" x="-8%" y="-8%" width="116%" height="116%">
      <feTurbulence type="fractalNoise" baseFrequency="0.08" numOctaves="2" seed="5" result="rough"/>
      <feDisplacementMap in="SourceGraphic" in2="rough" scale="1.1"/>
    </filter>
    
  </defs>
  
    <rect width="520" height="220" fill="none"/>
    <path d="M42 157 C116 91 190 180 259 111 C318 52 387 76 470 32" fill="none" stroke="#A9C9D8" stroke-width="12" stroke-linecap="round" opacity="0.32" filter="url(#softBleed)"/>
    <path d="M42 157 C116 91 190 180 259 111 C318 52 387 76 470 32" fill="none" stroke="#3D4338" stroke-width="4" stroke-dasharray="9 14" stroke-linecap="round" opacity="0.42" filter="url(#pencilRough)"/>
    <circle cx="96" cy="93" r="8" fill="#D8B36A" opacity="0.42"/>
    <circle cx="198" cy="173" r="6" fill="#E9B9A4" opacity="0.42"/>
    <circle cx="354" cy="70" r="7" fill="#8FAF95" opacity="0.42"/>
    <path d="M 408 63 L 493 28 L 463 99 L 445 72 Z" fill="#FFF9EF" stroke="#3D4338" stroke-width="4" stroke-linejoin="round" filter="url(#softBleed)"/>
    <path d="M445 72 L493 28 L456 82" fill="none" stroke="#74766F" stroke-width="3" stroke-linecap="round"/>
  
</svg>
