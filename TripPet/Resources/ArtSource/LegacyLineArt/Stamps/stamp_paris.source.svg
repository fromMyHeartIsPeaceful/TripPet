<svg xmlns="http://www.w3.org/2000/svg" width="180" height="180" viewBox="0 0 180 180" role="img" aria-label="stamp_paris" >
  <defs>
    <filter id="paperNoise" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" seed="17" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 0.08"/>
      </feComponentTransfer>
    </filter>
    <filter id="softBleed" x="-12%" y="-12%" width="124%" height="124%">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="9" result="texture"/>
      <feDisplacementMap in="SourceGraphic" in2="texture" scale="3.2"/>
    </filter>
    <filter id="pencilRough" x="-8%" y="-8%" width="116%" height="116%">
      <feTurbulence type="fractalNoise" baseFrequency="0.08" numOctaves="2" seed="5" result="rough"/>
      <feDisplacementMap in="SourceGraphic" in2="rough" scale="1.1"/>
    </filter>
    
  </defs>
  
    <circle cx="90" cy="90" r="69" fill="none" stroke="#D8B36A" stroke-width="7" opacity="0.72" filter="url(#pencilRough)"/>
    <circle cx="90" cy="90" r="52" fill="none" stroke="#D8B36A" stroke-width="3" opacity="0.45" filter="url(#pencilRough)"/>
    <path d="M91 62 L59 143 L122 143 Z M77 102 L104 102" fill="none" stroke="#D8B36A" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M22 163 C65 143 124 145 164 164" fill="none" stroke="#D8B36A" stroke-width="5" stroke-linecap="round" opacity="0.5"/>
    <path d="M17 26 C63 42 122 40 164 24" fill="none" stroke="#D8B36A" stroke-width="4" stroke-linecap="round" opacity="0.45"/>
  
</svg>
