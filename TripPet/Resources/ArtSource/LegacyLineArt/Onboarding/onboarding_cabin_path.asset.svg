    <path d="M166 352 L290 250 L414 352 Z" fill="#E9B9A4" opacity="0.34" stroke="#3D4338" stroke-width="5" stroke-linejoin="round" filter="url(#pencilRough)"/>
    <path d="M190 346 L391 346 L378 489 L205 489 Z" fill="#F7EEDC" stroke="#74766F" stroke-width="5" filter="url(#softBleed)"/>
    <rect x="255" y="394" width="58" height="95" rx="18" fill="#8FAF95" opacity="0.42" stroke="#3D4338" stroke-width="4"/>
    <rect x="326" y="381" width="42" height="42" rx="10" fill="#A9C9D8" opacity="0.62" stroke="#74766F" stroke-width="3"/>
