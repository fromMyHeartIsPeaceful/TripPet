    <path d="M129 178 C91 190 87 244 124 260 M268 178 C306 190 310 244 273 260" fill="#D8B36A" opacity="0.38" stroke="#3D4338" stroke-width="5" stroke-linecap="round" filter="url(#softBleed)"/>
    <circle cx="171" cy="236" r="6" fill="#3D4338"/>
    <circle cx="225" cy="236" r="6" fill="#3D4338"/>
    <path d="M191 255 C197 262 204 262 210 255 M180 276 C193 288 217 288 230 276" fill="none" stroke="#3D4338" stroke-width="4" stroke-linecap="round"/>
    <path d="M82 347 C136 367 269 366 326 347" fill="none" stroke="#DED6C7" stroke-width="4" stroke-linecap="round" opacity="0.58"/>
  
</svg>
