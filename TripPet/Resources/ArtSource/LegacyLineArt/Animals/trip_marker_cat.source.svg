<svg xmlns="http://www.w3.org/2000/svg" width="180" height="180" viewBox="0 0 180 180" role="img" aria-label="trip_marker_cat" >
  <defs>
    <filter id="paperNoise" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" seed="17" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 0.08"/>
      </feComponentTransfer>
    </filter>
    <filter id="softBleed" x="-12%" y="-12%" width="124%" height="124%">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="9" result="texture"/>
      <feDisplacementMap in="SourceGraphic" in2="texture" scale="3.2"/>
    </filter>
    <filter id="pencilRough" x="-8%" y="-8%" width="116%" height="116%">
      <feTurbulence type="fractalNoise" baseFrequency="0.08" numOctaves="2" seed="5" result="rough"/>
      <feDisplacementMap in="SourceGraphic" in2="rough" scale="1.1"/>
    </filter>
    
  </defs>
  
    <ellipse cx="92" cy="112" rx="58" ry="44" fill="#E9B9A4" opacity="0.18" filter="url(#softBleed)"/>
    <path d="M90 168 C59 129 40 99 40 69 C40 37 62 17 91 17 C120 17 141 38 141 68 C141 99 121 130 90 168 Z" fill="#F7EEDC" stroke="#3D4338" stroke-width="5" filter="url(#softBleed)"/>
    <path d="M65 61 L76 38 L90 62 M96 62 L110 38 L119 63" fill="#F7EEDC" stroke="#3D4338" stroke-width="4" stroke-linejoin="round"/>
    <circle cx="77" cy="76" r="4.5" fill="#3D4338"/>
    <circle cx="103" cy="76" r="4.5" fill="#3D4338"/>
    <path d="M86 89 C89 94 94 94 97 89 M78 101 C87 109 101 109 110 101" fill="none" stroke="#3D4338" stroke-width="3" stroke-linecap="round"/>
    <path d="M90 168 C83 151 97 151 90 168 Z" fill="#8FAF95" opacity="0.42"/>
  
</svg>
